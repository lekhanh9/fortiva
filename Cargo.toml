[package]
name = "fortiva"
version = "0.1.0"
edition = "2021"
description = "Fortiva - iOS sideload tool"
license = "GPL-3.0-or-later"

[lib]
name = "fortiva"
path = "src/lib.rs"

[[bin]]
name = "fortiva"
path = "src/main.rs"

[dependencies]
pem = "3"
idevice = { version = "=0.1.68", features = ["full"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }

rcgen = "0.13"
x509-cert = "0.2"
der = { version = "0.7", features = ["oid"] }
x509-certificate = "=0.25.0"
# HTTP + JSON
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "cookies", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Plist
plist = "1.10"

# Crypto (auth)
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
# OpenSSL (CSR + P12)
openssl = { version = "0.10" }


# Codesign
apple-codesign = { git = "https://github.com/lekhanh9/apple-platform-rs", branch = "main" }
p12-keystore = "0.3"

# Archive
zip = "2"
walkdir = "2"

# Device
# Misc
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rand = "0.8"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
anyhow = "1"
indicatif = "0.17"
thiserror = "1"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
idevice = { git = "https://github.com/lekhanh9/idevice", branch = "master", package = "idevice" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("obfuscate"))'] }
