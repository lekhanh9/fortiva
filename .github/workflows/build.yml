name: Build fortiva

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: fortiva.exe
            tool: cargo
            use_upx: true

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: fortiva
            tool: cargo
            use_upx: true

          # Linux ARM64 & ARMv7 (Chạy qua Docker container)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: fortiva
            tool: cross
            use_upx: true

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            binary_name: fortiva
            tool: cross
            use_upx: true

          # Android ARM64 & ARMv7 (Tắt UPX để tránh lỗi SELinux / Segfault)
          - os: ubuntu-latest
            target: aarch64-linux-android
            binary_name: fortiva
            tool: cargo-ndk
            use_upx: false

          - os: ubuntu-latest
            target: armv7-linux-androideabi
            binary_name: fortiva
            tool: cargo-ndk
            use_upx: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cài đặt UPX
      - name: Setup UPX (Linux)
        if: matrix.use_upx == true && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Setup UPX (Windows)
        if: matrix.use_upx == true && runner.os == 'Windows'
        run: choco install upx --no-progress

      # Cài đặt cross
      - name: Setup cross
        if: matrix.tool == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # Cài đặt cargo-ndk
      - name: Setup cargo-ndk
        if: matrix.tool == 'cargo-ndk'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # Build theo từng nhánh công cụ
      - name: Build with cargo (Native)
        if: matrix.tool == 'cargo'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build with cross (Linux ARM)
        if: matrix.tool == 'cross'
        run: cross build --release --target ${{ matrix.target }}

      # Android tự nhận ANDROID_NDK_ROOT từ hệ thống, bỏ env rỗng đi là xong
      - name: Build with cargo-ndk (Android)
        if: matrix.tool == 'cargo-ndk'
        run: cargo ndk --target ${{ matrix.target }} build --release

      # Nén binary bằng UPX
      - name: Compress binary with UPX
        if: matrix.use_upx == true
        run: upx --best --lzma target/${{ matrix.target }}/release/${{ matrix.binary_name }}
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortiva-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          if-no-files-found: error
